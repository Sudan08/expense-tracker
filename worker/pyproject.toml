[project]
name = "expense-tracker"
version = "0.1.0"
description = "Local batch worker: bank email/SMS -> normalized ledger -> Supabase"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "imap-tools>=1.5",
    "selectolax>=0.3",
    "supabase>=2",
    "psycopg[binary]>=3",
    "typer>=0.12",
    "python-dotenv>=1",
    "xlrd>=2",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyyaml>=6",
    "xlwt>=1.3",
]

[project.scripts]
expense-tracker = "expense_tracker.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/expense_tracker"]
