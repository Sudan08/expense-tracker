name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  worker:
    name: worker (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]

    # The offline suite needs no database, but the integration tests do, and
    # skipping them in CI would mean the migrations are never actually
    # executed anywhere automated. conftest.py applies them itself when
    # EXPENSE_TRACKER_TEST_DB_URL is set.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: expense_tracker_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        working-directory: worker
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Test (offline only)
        working-directory: worker
        run: pytest -q

      - name: Test (with Postgres, runs migrations)
        working-directory: worker
        env:
          EXPENSE_TRACKER_TEST_DB_URL: postgresql://postgres:postgres@localhost:5432/expense_tracker_test
        run: pytest -q

  no-real-account-data:
    name: fixtures carry no real account data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A redaction commit cannot un-publish what an earlier commit exposed,
      # so this gate is worth failing loudly on. It catches the shapes a real
      # Nabil/eSewa/Laxmi notification carries; it is a backstop for the
      # checklist in docs/ADDING_A_PARSER.md, not a replacement for reading it.
      - name: Scan fixtures
        run: |
          set -uo pipefail
          patterns='@gmail\.com|@yahoo\.com|@outlook\.com|@hotmail\.com'
          found=0

          if grep -rInE "$patterns" worker/tests/fixtures/ \
               | grep -viE 'fixtureuser@example\.com|@example\.(com|org|net)'; then
            echo "::error::a real-looking personal email address is present in the fixtures"
            found=1
          fi

          # Nepali mobile numbers are 98/97 + 8 digits. The synthetic ones are
          # all 98000000NN, so anything else is a real number.
          if grep -rInoE '\b9[78][0-9]{8}\b' worker/tests/fixtures/ \
               | grep -vE '98000000[0-9]{2}'; then
            echo "::error::a real-looking phone number is present in the fixtures"
            found=1
          fi

          exit $found

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup mobile .env
        working-directory: mobile
        run: cp .env.example .env

      - name: Install
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze

      - name: Test
        working-directory: mobile
        run: flutter test
